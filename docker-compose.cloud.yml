# ==============================================================================
# TariffGuard — Docker Compose for Cloud Database (e.g. Aiven MySQL)
# Runs Backend API + Next.js Frontend without local MySQL container.
# ==============================================================================

services:
  # Backend API
  backend:
    build: ./backend
    container_name: tariffguard_backend_cloud
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      AI_PROVIDER: ${AI_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      ALCHEMY_KEY: ${ALCHEMY_KEY:-}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - tariffguard_network

  # Frontend Web UI
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: tariffguard_frontend_cloud
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - tariffguard_network

networks:
  tariffguard_network:
    driver: bridge
