services:
  # ----------------------------------------------------------------------------
  # Backend API Service (FastAPI + OR-Tools + XGBoost)
  # ----------------------------------------------------------------------------
  - type: web
    name: tariffguard-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m seed --days 90 && python train_model.py && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with your Aiven MySQL URI
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

  # ----------------------------------------------------------------------------
  # Frontend Web UI (Next.js 16)
  # ----------------------------------------------------------------------------
  - type: web
    name: tariffguard-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: NEXT_PUBLIC_API_URL
        sync: false # Point to your https://tariffguard-backend.onrender.com URL
